  P2:
    name: waubesa_minus_kegonsa
    lake_a: waubesa
    lake_b: kegonsa
    lake_tri: monona
    role: secondary_v0
  P3:
    name: mendota_minus_monona
    lake_a: mendota
    lake_b: monona
    lake_tri: waubesa
    role: secondary_v0

pairs:
