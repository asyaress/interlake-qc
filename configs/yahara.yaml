# Yahara chain validation (amendment_1: P2 primary)
seed: 42

paths:
  d2_final: configs/mahakam.yaml
  gage_csv: data/processed/yahara_usgs_subset.csv
  # sites_csv optional for processed subset
  out_dir: outputs/yahara

lakes:
  mendota:  {lake_id: "7421069523", gage_id: "05428000"}
  monona:   {lake_id: "7421069562", gage_id: "05429000"}
  waubesa:  {lake_id: "7421071452", gage_id: "05429485"}
  kegonsa:  {lake_id: "7421071552", gage_id: "425715089164700"}

exclude_lake_ids: ["7421071062"]

detection_main:
  h_threshold_m: -1.0e9
  k_high: 3.5
  k_low: 3.5
detection_sens_k4:
  h_threshold_m: -1.0e9
  k_high: 4.0
  k_low: 4.0

main_set:
  quality_f: [0, 1]
  ice_clim_f: 0
  version: D
  p1_min_q01_d_only: 60
  fallback_version_policy: "D_preferred_else_C"

pair_match:
  max_dt_sec: 120

